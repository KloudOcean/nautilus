spring:
  application:
    name: nautilus

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

nautilus:
  routing:
    # Selects the active routing strategy. See docs/guides/routing-strategies.md.
    # Built-in: priority
    strategy: priority

    # Provider entries in priority order (lower = higher priority).
    # The mock provider is the only one shipping in v0.1; real providers
    # (Claude, OpenAI, Llama, Mistral) plug in via the LlmProvider SPI.
    providers:
      - name: mock
        priority: 1
        enabled: true

  provider:
    mock:
      enabled: true

logging:
  level:
    root: INFO
    com.kloudocean.nautilus: DEBUG
